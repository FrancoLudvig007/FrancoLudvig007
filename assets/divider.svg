<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
    <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00D9FF" stop-opacity=".9"/>
    <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="dot"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .dia{transform-origin:500px 12px;animation:dia 2.4s ease-in-out infinite}
  @keyframes dia{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(225deg) scale(1.35)}}
</style>
<rect x="0" y="11" width="1000" height="2" fill="url(#lg)"/>
<circle r="5" fill="url(#dot)"><animateMotion dur="3s" repeatCount="indefinite" path="M500,12 L40,12"/><animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite"/></circle>
<circle r="5" fill="url(#dot)"><animateMotion dur="3s" repeatCount="indefinite" path="M500,12 L960,12"/><animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite"/></circle>
<rect class="dia" x="494" y="6" width="12" height="12" fill="#0D1117" stroke="#00D9FF" stroke-width="1.8"/>
</svg>
