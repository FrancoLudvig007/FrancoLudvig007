<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-label="Animacao de Proof of Work minerando um bloco" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text{font-family:'Fira Code','JetBrains Mono','SF Mono',Consolas,'Courier New',monospace}
  .march{stroke-dasharray:6 6;animation:march 1s linear infinite}
  @keyframes march{to{stroke-dashoffset:-12}}
  .fr{opacity:0;animation:fr 6s linear infinite}
  @keyframes fr{0%{opacity:1}3.3%{opacity:0}100%{opacity:0}}
  .lock{opacity:0;animation:lock 6s linear infinite}
  @keyframes lock{0%,66.6%{opacity:0}66.7%,100%{opacity:1}}
  .mining{animation:mining 6s linear infinite}
  @keyframes mining{0%,66.6%{opacity:1}66.7%,100%{opacity:0}}
  .bd{animation:bd 6s linear infinite}
  @keyframes bd{0%,66.6%{stroke:#f59e0b}66.7%,100%{stroke:#00ff9d}}
  .flash{opacity:0;animation:flash 6s linear infinite}
  @keyframes flash{0%,66.6%{opacity:0}67.5%{opacity:.35}100%{opacity:0}}
  .dot{animation:dotp .9s ease-in-out infinite}
  @keyframes dotp{0%,100%{opacity:1}50%{opacity:.2}}
  .spin{transform-origin:0 0;animation:spin 2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
