<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Radar de áreas de atuação">
<defs>
  <filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="sweep" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 205) scale(150)">
    <stop offset="0" stop-color="#A3FF12" stop-opacity=".0"/>
    <stop offset="1" stop-color="#A3FF12" stop-opacity=".45"/>
  </radialGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".55"/></pattern>
  <style>
    text { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; }
    @keyframes bk { 0%,70% { opacity:1; } 71%,100% { opacity:.15; } }
    .b0{animation:bk 2.6s steps(1) infinite;animation-delay:0.0s}.b1{animation:bk 2.6s steps(1) infinite;animation-delay:0.4s}.b2{animation:bk 2.6s steps(1) infinite;animation-delay:0.8s}.b3{animation:bk 2.6s steps(1) infinite;animation-delay:1.2s}.b4{animation:bk 2.6s steps(1) infinite;animation-delay:1.6s}
    .pulse { animation: pu 2.4s ease-in-out infinite; }
    @keyframes pu { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  </style>
</defs>
